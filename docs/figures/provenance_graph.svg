;s inputs; the tables name more (the composition&#x27;s 35, the numbering tables&#x27; 57). * withheld: the method cites the project&#x27;s private working records. Dates as the records give them, in UTC. The trace stops at the public source: ChannelScope records what came back, and when.</desc><rect x="1" y="1" width="918" height="678" rx="12" fill="#fdfdfb" stroke="#d9d9d4" stroke-width="1"/><text x="24" y="32" font-size="15" fill="#333" font-weight="600">One value, followed back to its sources</text><text x="24" y="52" font-size="12" fill="#666">Human residue 614, at pig 615 in structure 9PWO, chain A, as ChannelScope's evidence graph holds it</text><rect x="632" y="74" width="276" height="102" rx="10" fill="#fff7f2" stroke="#D55E00" stroke-width="1.6"/><text x="646" y="96" font-size="12.5" fill="#333" font-weight="600">9PWO, chain A, at human 614</text><text x="646" y="116" font-size="11.5" fill="#666">pig 615: cysteine, a declared variant (R615C)</text><text x="646" y="133" font-size="11.5" fill="#666">joined · open at the gate · 5.27 Å</text><text x="646" y="150" font-size="11.5" fill="#333">local model quality: not assessed</text><rect x="330" y="98" width="236" height="52" rx="8" fill="#fff" stroke="#666" stroke-width="1.2"/><rect x="339" y="117" width="18" height="14" fill="#fff" stroke="#666" stroke-width="1.2"/><path d="M339 122 H357 M339 127 H357 M345 117 V131 M351 117 V131" stroke="#9a9a9a" stroke-width="1"/><text x="366" y="121" font-size="12.5" fill="#333" font-weight="600">the composition's structures</text><text x="366" y="137" font-size="11.5" fill="#666">31,096 rows · sha256:ffcd…</text><rect x="32" y="98" width="232" height="52" rx="8" fill="#fff" stroke="#666" stroke-width="1.2"/><circle cx="50" cy="124" r="9" fill="#fff" stroke="#666" stroke-width="1.2"/><path d="M47 119 L55 124 L47 129 Z" fill="#666"/><text x="68" y="121" font-size="12.5" fill="#333" font-weight="600">compose the evidence</text><text x="68" y="137" font-size="11.5" fill="#666"