<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">The gate's radius in 26 structures</title>
  <desc id="d">Left, a sketch of the gate seen down the pore: a ring of four isoleucines, one from each subunit, narrow when closed and wide when open. Right, the radius at the gate on a scale from 0 to 6 angstroms: 14 structures fall from 0.83 to 1.52 and are classed closed, 12 fall from 3.20 to 5.55 and are classed open, and none falls between, where a structure would be classed indeterminate. The class lines, at 2.0 and 3.0 angstroms, are this project's own and sit in the gap.</desc>
  <rect x="0.5" y="0.5" width="919" height="299" rx="10" fill="#fbfaf7" stroke="#dcdad3"/>
  <text x="24" y="31" font-size="15" font-weight="600" fill="#333">The gate's radius in 26 structures</text>

  <!-- left: the ring, seen down the pore (drawn for shape only) -->
  <text x="190" y="62" font-size="12" fill="#666" text-anchor="middle">the gate, seen down the pore:</text>
  <text x="190" y="78" font-size="12" fill="#666" text-anchor="middle">four isoleucines, one from each subunit</text>
  <g stroke="#666" stroke-width="1.5" fill="#fff">
    <circle cx="97" cy="131" r="16"/><circle cx="127" cy="131" r="16"/>
    <circle cx="97" cy="161" r="16"/><circle cx="127" cy="161" r="16"/>
    <circle cx="232" cy="113" r="16"/><circle cx="296" cy="113" r="16"/>
    <circle cx="232" cy="177" r="16"/><circle cx="296" cy="177" r="16"/>
  </g>
  <g fill="#888" font-size="10" text-anchor="middle">
    <text x="97" y="134.5">Ile</text><text x="127" y="134.5">Ile</text><text x="97" y="164.5">Ile</text><text x="127" y="164.5">Ile</text>
    <text x="232" y="116.5">Ile</text><text x="296" y="116.5">Ile</text><text x="232" y="180.5">Ile</text><text x="296" y="180.5">Ile</text>
  </g>
  <circle cx="112" cy="146" r="2" fill="#333"/>
  <circle cx="264" cy="145" r="2" fill="#333"/>
  <circle cx="112" cy="146" r="5" fill="none" stroke="#d4661c" stroke-width="1.2" stroke-dasharray="2 2"/>
  <circle cx="264" cy="145" r="29" fill="none" stroke="#d4661c" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="264" y1="145" x2="284.5" y2="124.5" stroke="#d4661c" stroke-width="1.6"/>
  <text x="298" y="149" font-size="11" fill="#d4661c">radius</text>
  <text x="112" y="214" font-size="13" font-weight="600" fill="#333" text-anchor="middle">closed</text>
  <text x="112" y="230" font-size="12" fill="#666" text-anchor="middle">narrow at the ring</text>
  <text x="264" y="214" font-size="13" font-weight="600" fill="#333" text-anchor="middle">open</text>
  <text x="264" y="230" font-size="12" fill="#666" text-anchor="middle">wide at the ring</text>
  <text x="190" y="252" font-size="11" font-style="italic" fill="#999" text-anchor="middle">drawn for shape only</text>

  <!-- right: the measured radii -->
  <line x1="360" y1="40" x2="360" y2="262" stroke="#e3e1db"/>
  <text x="600" y="66" font-size="12" fill="#555" text-anchor="middle">this project's class lines, 2.0 and 3.0 Å,</text>
  <text x="600" y="81" font-size="12" fill="#555" text-anchor="middle">committed before the first measurement</text>
  <g stroke="#999" stroke-width="1.3" stroke-dasharray="4 3">
    <line x1="560" y1="92" x2="560" y2="200"/>
    <line x1="640" y1="92" x2="640" y2="200"/>
  </g>
  <rect x="466.4" y="152" width="55.2" height="40" rx="4" fill="#c9d7e6" stroke="#6f8fb1" stroke-width="1.3"/>
  <rect x="656" y="152" width="188" height="40" rx="4" fill="#cfe7de" stroke="#5f9f88" stroke-width="1.3"/>
  <text x="494" y="128" font-size="13" font-weight="600" fill="#333" text-anchor="middle">closed: 14</text>
  <text x="494" y="144" font-size="12" fill="#555" text-anchor="middle">0.83 to 1.52 Å</text>
  <text x="750" y="128" font-size="13" font-weight="600" fill="#333" text-anchor="middle">open: 12</text>
  <text x="750" y="144" font-size="12" fill="#555" text-anchor="middle">3.20 to 5.55 Å</text>
  <text x="600" y="168" font-size="11.5" font-style="italic" fill="#888" text-anchor="middle">indeterminate:</text>
  <text x="600" y="183" font-size="11.5" font-style="italic" fill="#888" text-anchor="middle">none here</text>

  <line x1="400" y1="200" x2="880" y2="200" stroke="#666" stroke-width="1.4"/>
  <g stroke="#666" stroke-width="1.4">
    <line x1="400" y1="200" x2="400" y2="206"/><line x1="480" y1="200" x2="480" y2="206"/>
    <line x1="560" y1="200" x2="560" y2="206"/><line x1="640" y1="200" x2="640" y2="206"/>
    <line x1="720" y1="200" x2="720" y2="206"/><line x1="800" y1="200" x2="800" y2="206"/>
    <line x1="880" y1="200" x2="880" y2="206"/>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="400" y="221">0</text><text x="480" y="221">1</text><text x="560" y="221">2</text><text x="640" y="221">3</text>
    <text x="720" y="221">4</text><text x="800" y="221">5</text><text x="880" y="221">6 Å</text>
  </g>
  <text x="640" y="244" font-size="12" fill="#666" text-anchor="middle">radius at the gate, by the first implementation, in ångströms</text>
  <text x="24" y="284" font-size="12" fill="#555">"Closed" and "open" mean narrow or wide at the gate's ring, not whether ions flow.</text>
</svg>
