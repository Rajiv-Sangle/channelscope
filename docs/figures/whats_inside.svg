<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 524" width="920" height="524" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">What version 0.1 holds, and how its parts connect</title>
  <desc id="d">Three parts, the mappings between species, the residue numbering of 26 structures and the gate's state in the same 26 structures, feed a fourth, the evidence for 299 residues side by side; the gate's part also reads the numbering part's gate numbering. Each part names what it reads and the folder that holds it. Below them, the exon map, four of whose files fed the composition's gnomAD table, and the code.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="919" height="523" rx="10" fill="#fbfaf7" stroke="#dcdad3"/>
  <text x="24" y="31" font-size="15" font-weight="600" fill="#333">What version 0.1 holds, and how its parts connect</text>

  <g fill="#fff" stroke="#cfcdc6" stroke-width="1.2">
    <rect x="20" y="48" width="278" height="160" rx="8"/>
    <rect x="321" y="48" width="278" height="160" rx="8"/>
    <rect x="622" y="48" width="278" height="160" rx="8"/>
    <rect x="20" y="422" width="430" height="86" rx="8"/>
    <rect x="470" y="422" width="430" height="86" rx="8"/>
  </g>
  <rect x="150" y="282" width="620" height="112" rx="8" fill="#fff" stroke="#d4661c" stroke-width="2"/>

  <g font-size="12" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="44" cy="74" r="11" fill="#444"/><text x="44" y="78">1</text>
    <circle cx="345" cy="74" r="11" fill="#444"/><text x="345" y="78">2</text>
    <circle cx="646" cy="74" r="11" fill="#444"/><text x="646" y="78">3</text>
    <circle cx="174" cy="308" r="11" fill="#d4661c"/><text x="174" y="312">4</text>
  </g>

  <g fill="#333" font-size="14" font-weight="600">
    <text x="64" y="79">Mappings between species</text>
    <text x="365" y="79">Residue numbering, checked</text>
    <text x="666" y="79">The gate, closed or open</text>
    <text x="194" y="313">The evidence side by side, for 299 residues</text>
    <text x="36" y="448" font-size="13">The exon map</text>
    <text x="486" y="448" font-size="13">The code</text>
  </g>

  <g fill="#555" font-size="12">
    <text x="36" y="104">every human residue mapped to its</text>
    <text x="36" y="120">partner in rabbit, mouse and pig</text>
    <text x="36" y="136">RyR1, each row flagged for reliability</text>
    <text x="337" y="104">26 structures of rabbit, mouse and pig</text>
    <text x="337" y="120">RyR1, checked against UniProt, and</text>
    <text x="337" y="136">against SIFTS for the 20 it maps</text>
    <text x="638" y="104">the pore's radius at the gate in the</text>
    <text x="638" y="120">same 26 structures, beside any words</text>
    <text x="638" y="136">naming a structure's state</text>
    <text x="166" y="336">for each residue: its partners, the structures that model them and their state,</text>
    <text x="166" y="352">gnomAD's variants and ClinVar's classification, side by side, with no verdict</text>
    <text x="36" y="468">the exons of human RYR1's transcript NM_000540.3,</text>
    <text x="36" y="484">as the files an explanatory article's figure reads</text>
    <text x="486" y="468">the package as it stood when this version was exported,</text>
    <text x="486" y="484">with its environment pinned</text>
  </g>

  <g fill="#888" font-size="11.5" font-style="italic">
    <text x="36" y="158">reads UniProt, RefSeq, Ensembl, UCSC</text>
    <text x="36" y="174">and ClinVar's descriptions</text>
    <text x="337" y="158">reads PDB files, UniProt and SIFTS</text>
    <text x="638" y="158">reads PDB files, titles, papers and</text>
    <text x="638" y="174">part 2's numbering at the gate</text>
    <text x="166" y="370">adds ClinVar's expert-panel records and gnomAD</text>
  </g>

  <g fill="#a0521d" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">
    <text x="36" y="196">releases/ryr1_mappings_v0.1/</text>
    <text x="337" y="196">checks/structure_numbering/</text>
    <text x="638" y="196">releases/ryr1_structure_states_v0.1/</text>
    <text x="166" y="386">releases/ryr1_composition_v0.1/</text>
    <text x="36" y="500">releases/exon_map_v0.5.3/</text>
    <text x="486" y="500">code/</text>
  </g>

  <g stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#ar)">
    <path d="M159,208 C159,244 250,248 262,278"/>
    <path d="M460,208 V276"/>
    <path d="M761,208 C761,244 670,248 658,278"/>
    <path d="M235,422 V398" stroke-dasharray="4 3"/>
  </g>
  <g fill="#777" font-size="11.5" font-style="italic">
    <text x="194" y="252" text-anchor="end">the partners</text>
    <text x="468" y="248">the numbering it joins on</text>
    <text x="728" y="252" text-anchor="start">each structure's state</text>
    <text x="246" y="414" font-size="11">four of its files fed the gnomAD table</text>
  </g>
</svg>
