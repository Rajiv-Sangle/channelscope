<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 476" width="920" height="476" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">What version 0.1 shows, and the premises above it</title>
  <desc id="d">At the base, what version 0.1 shows: provenance, and four parts built on it, the mappings between species, the residue numbering, the gate's state and the evidence side by side. Above them, seven premises, drawn dashed because none is shown here: a new source or method is added without rewriting what exists; the same holds for every residue and for further sources; Kimlicka et al. (2013) propose that contacts between subunits in the N-terminal region are disrupted when the channel opens, and that a random disease mutation there is much more likely to weaken them than to strengthen them; evidence gathered for RyR1 transfers to RyR2; laying the evidence side by side helps choose variants of uncertain significance for laboratory tests; the tables can serve as training data for models; and the same records serve other genes.</desc>
  <rect x="0.5" y="0.5" width="919" height="475" rx="10" fill="#fbfaf7" stroke="#dcdad3"/>
  <text x="24" y="31" font-size="15" font-weight="600" fill="#333">What version 0.1 shows, and the premises above it</text>

  <text x="24" y="56" font-size="12" font-weight="700" fill="#d4661c">premises: none is shown here</text>
