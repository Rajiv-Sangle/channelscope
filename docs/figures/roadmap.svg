    <text x="479" y="86">Kimlicka et al. (2013) propose</text>
    <text x="479" y="102">that subunit contacts in the</text>
    <text x="479" y="118">N-terminal region are disrupted</text>
    <text x="479" y="134">when the channel opens</text>
    <text x="701.5" y="86">Evidence gathered for RyR1</text>
    <text x="701.5" y="102">transfers to its paralogue RyR2</text>
